adb_target=localhost:5555
sequence=LIKE,LIKE,SKIP,SKIP,SKIP
cycles=1
max_total_actions=40
max_likes=8
dry_run=true
start_delay_s=15
delay_ms=2500,6000
cycle_pause_ms=4000,9000
post_action_settle_ms=1200
app_package=co.hinge.app
use_fallback_ratios=false
stop_file=~/hingebot.stop
log_dir=logs
labels.like=Like,Heart
labels.skip=Skip,Remove,Pass
labels.send_like=Send like,Send Like
labels.out_of_likes=out of likes,no likes left,run out of likes
fallback.like=0.88,0.70
fallback.skip=0.12,0.92
fallback.send_like=0.50,0.90
